<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StackPeek</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="sp">
    <header class="sp-top">
      <div class="sp-brand">
        <img class="sp-logo" src="../icons/icon48.png" alt="" aria-hidden="true" />
        <span class="sp-word">Stack<b>Peek</b></span>
      </div>
      <div class="sp-top-actions">
        <button class="sp-icon-btn" id="rescan-btn" type="button" title="Rescan this tab" aria-label="Rescan this tab">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="sp-icon-btn" id="copy-btn" type="button" title="Copy summary" aria-label="Copy summary" disabled>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 5.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="sp-tabs" role="tablist">
      <button class="sp-tab is-active" id="tab-results" role="tab" aria-selected="true">Detected</button>
      <button class="sp-tab" id="tab-history" role="tab" aria-selected="false">History</button>
    </nav>

    <div class="sp-site" id="site-bar" hidden>
      <div class="sp-site-host" id="site-host"></div>
      <div class="sp-site-meta" id="site-meta"></div>
    </div>

    <main class="sp-body">
      <section class="sp-panel is-active" id="panel-results"><div id="results-root"></div></section>
      <section class="sp-panel" id="panel-history" hidden><div id="history-root"></div></section>
    </main>

    <div class="sp-toast" id="toast" role="status" aria-live="polite"></div>

    <footer class="sp-foot">
      <div class="sp-foot-row">
        <span class="sp-foot-badge">100% local</span>
        <span class="sp-foot-text">No account · no limits · no telemetry</span>
      </div>
      <a class="sp-credit" href="https://www.buildwithsiddesh.com/?utm_source=stackpeek&amp;utm_medium=extension&amp;utm_campaign=sidepanel" target="_blank" rel="noopener noreferrer" title="Built by Siddesh — buildwithsiddesh.com">
        <svg class="sp-bws" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#c8f135"/><path d="M7.4 7.6 C5.9 8.2 5.2 9.4 5.4 11 C5.6 12.4 5.2 13.4 4.2 14 C5.4 14.7 5.9 15.8 5.7 17.3 C5.5 18.9 6.1 20.2 7.6 20.9" stroke="#0a0a0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M24.6 7.6 C26.1 8.2 26.8 9.4 26.6 11 C26.4 12.4 26.8 13.4 27.8 14 C26.6 14.7 26.1 15.8 26.3 17.3 C26.5 18.9 25.9 20.2 24.4 20.9" stroke="#0a0a0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M12 7.8 H17 C19.2 7.8 20.7 9 20.7 11 C20.7 12.4 19.9 13.4 18.6 13.9 C20.2 14.3 21.1 15.5 21.1 17.1 C21.1 19.2 19.5 20.4 17.2 20.4 H12 Z M14.7 10.1 V12.9 H16.7 C17.7 12.9 18.3 12.4 18.3 11.5 C18.3 10.6 17.7 10.1 16.7 10.1 Z M14.7 15 V18.1 H17 C18 18.1 18.6 17.5 18.6 16.5 C18.6 15.6 18 15 17 15 Z" fill="#0a0a0c"/></svg>
        <span class="sp-credit-txt"><span class="sp-credit-kicker">Peeked &amp; shipped by</span><span class="sp-credit-brand">Build with Siddesh</span></span>
        <svg class="sp-credit-go" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 11L11 5M11 5H6M11 5V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </footer>
  </div>

  <script src="../data/fingerprints.js"></script>
  <script src="../data/logos.js"></script>
  <script src="../engine/detect.js"></script>
  <script src="../shared/textutil.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
