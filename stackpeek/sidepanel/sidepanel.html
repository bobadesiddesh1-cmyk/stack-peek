<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StackPeek</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="sp">
    <header class="sp-top">
      <div class="sp-brand">
        <img class="sp-logo" src="../icons/icon48.png" alt="" aria-hidden="true" />
        <span class="sp-word">Stack<b>Peek</b></span>
      </div>
      <div class="sp-top-actions">
        <button class="sp-icon-btn" id="rescan-btn" type="button" title="Rescan this tab" aria-label="Rescan this tab">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="sp-icon-btn" id="copy-btn" type="button" title="Copy summary" aria-label="Copy summary" disabled>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 5.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="sp-tabs" role="tablist">
      <button class="sp-tab is-active" id="tab-results" role="tab" aria-selected="true">Detected</button>
      <button class="sp-tab" id="tab-history" role="tab" aria-selected="false">History</button>
    </nav>

    <div class="sp-site" id="site-bar" hidden>
      <div class="sp-site-host" id="site-host"></div>
      <div class="sp-site-meta" id="site-meta"></div>
    </div>

    <main class="sp-body">
      <section class="sp-panel is-active" id="panel-results"><div id="results-root"></div></section>
      <section class="sp-panel" id="panel-history" hidden><div id="history-root"></div></section>
    </main>

    <div class="sp-toast" id="toast" role="status" aria-live="polite"></div>

    <footer class="sp-foot">
      <span class="sp-foot-badge">100% local</span>
      <span class="sp-foot-text">No account · no limits · no telemetry</span>
    </footer>
  </div>

  <script src="../data/fingerprints.js"></script>
  <script src="../data/logos.js"></script>
  <script src="../engine/detect.js"></script>
  <script src="../shared/textutil.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
