<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StackPeek</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="sp-app">
    <header class="sp-header">
      <div class="sp-brand">
        <img class="sp-logo" src="../icons/icon48.png" alt="" aria-hidden="true" />
        <span class="sp-title">Stack<span>Peek</span></span>
      </div>
      <div class="sp-head-right">
        <button class="sp-expand" id="expand-btn" type="button" title="Open results in a full tab" aria-label="Open results in a full tab">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.5 2H14v4.5M14 2l-5 5M6.5 14H2V9.5M2 14l5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <nav class="sp-tabs" role="tablist" aria-label="StackPeek views">
          <button class="sp-tab is-active" id="tab-results" role="tab" aria-selected="true" aria-controls="panel-results">Results</button>
          <button class="sp-tab" id="tab-history" role="tab" aria-selected="false" aria-controls="panel-history">History</button>
        </nav>
      </div>
    </header>

    <div class="sp-actionbar">
      <button class="sp-detect" id="detect-btn" type="button">
        <span class="sp-detect-label">Detect stack on this page</span>
      </button>
      <button class="sp-copy" id="copy-btn" type="button" disabled title="Copy a plain-text summary">Copy summary</button>
    </div>

    <main class="sp-main">
      <section class="sp-panel is-active" id="panel-results" role="tabpanel" aria-labelledby="tab-results">
        <div id="results-root"></div>
      </section>
      <section class="sp-panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
        <div id="history-root"></div>
      </section>
    </main>

    <div class="sp-status" id="status" role="status" aria-live="polite"></div>

    <footer class="sp-footer">
      <span class="sp-footer-badge">100% local</span>
      <span class="sp-footer-text">No account · no lookup limits · no telemetry. Runs against the current page in your browser.</span>
    </footer>
  </div>

  <!-- data + engine -->
  <script src="../data/fingerprints.js"></script>
  <script src="../engine/detect.js"></script>
  <!-- shared -->
  <script src="../shared/textutil.js"></script>
  <script src="../shared/storage.js"></script>
  <!-- views -->
  <script src="tabs/results.js"></script>
  <script src="tabs/history.js"></script>
  <!-- controller -->
  <script src="popup.js"></script>
</body>
</html>
